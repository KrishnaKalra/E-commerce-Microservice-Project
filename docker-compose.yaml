version: "3.8"

services:
  # --- Shared Infrastructure ---
  postgres:
    image: postgres:15-alpine
    container_name: microservice_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh
    command: ["postgres", "-c", "shared_buffers=64MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: microservice_redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Microservices ---
  auth-service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    container_name: auth-service
    environment:
      PORT: 3005
      BCRYPT_SALT_ROUNDS: 10
      JWT_PRIVATE_KEY: keys/private.pem
      JWT_PUBLIC_KEY: keys/public.pem
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/mydb
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"   # <─ memory cap
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  product-service:
    build:
      context: .
      dockerfile: product_service/Dockerfile
    container_name: product-service
    environment:
      PORT: 3006
      BCRYPT_SALT_ROUNDS: 10
      JWT_PUBLIC_KEY: keys/public.pem
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/product
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: order-service
    environment:
      PORT: 3007
      BCRYPT_SALT_ROUNDS: 10
      JWT_PUBLIC_KEY: keys/public.pem
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/order
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  inventory-service:
    build:
      context: .
      dockerfile: inventory_service/Dockerfile
    container_name: inventory-service
    environment:
      PORT: 3008
      BCRYPT_SALT_ROUNDS: 10
      JWT_PUBLIC_KEY: keys/public.pem
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/inventory
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment_service/Dockerfile
    container_name: payment-service
    environment:
      PORT: 3009
      BCRYPT_SALT_ROUNDS: 10
      JWT_PUBLIC_KEY: keys/public.pem
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      kafka:
        condition: service_healthy

  email-service:
    build:
      context: .
      dockerfile: email_service/Dockerfile
    container_name: email-service
    environment:
      GOOGLE_APP_PASSWORD: ${GOOGLE_APP_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKER: kafka:9092
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-gateway:
    build:
      context: .
      dockerfile: user-gateway/Dockerfile
    container_name: user-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE: http://auth-service:3005
      INVENTORY_SERVICE: http://inventory-service:3008/inventory
      ORDER_SERVICE: http://order-service:3007/order
      PRODUCT_SERVICE: http://product-service:3006/product
      JWT_PUBLIC_KEY: keys/public.pem
      NODE_OPTIONS: "--max-old-space-size=128"
    depends_on:
      - auth-service
      - product-service
      - order-service
      - inventory-service

volumes:
  postgres_data:
  redis_data:
